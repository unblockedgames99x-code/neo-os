<head>

  <title>Local game</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050708;color:#c7d5e0;font-family:Inter,"Segoe UI",sans-serif}

  </style>
</head>

  <iframe data-local-game-frame title="Local game" sandbox="allow-scripts allow-forms allow-downloads allow-pointer-lock allow-modals" allow="autoplay; fullscreen; gamepad; microphone; camera; pointer-lock; clipboard-read; clipboard-write" allowfullscreen hidden></iframe>
