<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdn.jsdelivr.net data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' https://cdn.jsdelivr.net data: blob:; connect-src https://cdn.jsdelivr.net; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Snow Rider 3D</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body, #gameContainer { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #111827; }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #gameContainer canvas { width: 100% !important; height: 100% !important; display: block; background: #111827; }
    .loading {
      position: fixed;
      z-index: 2;
      inset: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 42%, #243248, #111827 66%);
      color: #f8fafc;
      transition: opacity .18s ease;
    }
    .loading[hidden] { display: none; }
    .loading-card { width: min(340px, calc(100vw - 40px)); text-align: center; }
    .loading-card h1 { margin: 0 0 8px; font-size: clamp(24px, 5vw, 42px); }
    .loading-card p { margin: 0 0 18px; color: #cbd5e1; font-size: 14px; }
    .track { height: 6px; overflow: hidden; border-radius: 999px; background: rgba(255, 255, 255, .16); }
    .bar { width: 4%; height: 100%; border-radius: inherit; background: #f8fafc; transition: width .12s ease; }
    .retry { margin-top: 18px; padding: 9px 16px; border: 1px solid rgba(255,255,255,.26); border-radius: 999px; background: rgba(255,255,255,.1); color: #fff; font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <main id="gameContainer" aria-label="Snow Rider 3D game"></main>
  <section class="loading" data-loading role="status" aria-live="polite">
    <div class="loading-card">
      <h1>Snow Rider 3D</h1>
      <p data-loading-text>Loading game…</p>
      <div class="track" aria-hidden="true"><div class="bar" data-loading-bar></div></div>
    </div>
  </section>
  <script src="https://cdn.jsdelivr.net/gh/Vrkids2009/snowrider3d@6b7c2b9167b592528b221428414e63f06c4640b9/Build/UnityLoader.js"></script>
  <script>
    (() => {
      'use strict';
      const loading = document.querySelector('[data-loading]');
      const loadingText = document.querySelector('[data-loading-text]');
      const loadingBar = document.querySelector('[data-loading-bar]');
      let finished = false;

      function ready() {
        if (finished) return;
        finished = true;
        loadingBar.style.width = '100%';
        window.setTimeout(() => { loading.hidden = true; }, 120);
        document.getElementById('gameContainer').focus?.();
      }

      function fail() {
        if (finished) return;
        loadingText.textContent = 'The game could not start.';
        loadingBar.style.width = '0%';
        if (!loading.querySelector('.retry')) {
          const retry = document.createElement('button');
          retry.className = 'retry';
          retry.type = 'button';
          retry.textContent = 'Retry';
          retry.addEventListener('click', () => location.reload());
          loading.querySelector('.loading-card').append(retry);
        }
      }

      try {
        if (!globalThis.UnityLoader?.instantiate) throw new Error('Unity loader unavailable');
        globalThis.__neoSnowRiderGame = UnityLoader.instantiate(
          'gameContainer',
          'https://cdn.jsdelivr.net/gh/Vrkids2009/snowrider3d@6b7c2b9167b592528b221428414e63f06c4640b9/Build/SnowRider3D-gd-1.json',
          {
            onProgress(_instance, progress) {
              const value = Math.max(0.04, Math.min(1, Number(progress) || 0));
              loadingBar.style.width = `${Math.round(value * 100)}%`;
              if (value >= 1) ready();
            },
            Module: { onRuntimeInitialized: ready }
          }
        );
      } catch (error) {
        console.error('[NEO] Snow Rider compatibility page failed.', error);
        fail();
      }
      window.addEventListener('error', (event) => {
        if (event.target?.tagName === 'SCRIPT') fail();
      }, true);
    })();
  </script>
</body>
</html>
