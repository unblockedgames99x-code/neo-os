<!doctype html>
<html lang="en">
<head>
  <script src="../neo-ad-shield.js?v=20260912-sitewide-v2"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>NEO Browser · Local</title>
  <script src="../neo-app-theme.js?v=20260907-theme-system-v2&amp;styles=launcher-picture-alignment-v12"></script>
  <link rel="stylesheet" href="./local-browser.css">
  <link rel="stylesheet" href="../neo-fonts.css?v=20260912-native-fast-v1">
  <link rel="stylesheet" href="../neo-theme-system.css?v=20260907-theme-system-v2">
  <link rel="stylesheet" href="../neo-liquid-scrollbars.css?v=20260907-scroll-containers-v2">
  <script src="./local-browser.js" defer></script>
</head>
<body>
  <header><strong>NEO <span>Browser</span></strong><span class="badge">Local</span><button id="home" aria-label="Home">Home</button><button id="back" aria-label="Back" disabled>←</button><button id="forward" aria-label="Forward" disabled>→</button><form id="search-form"><input id="query" type="search" placeholder="Search local pages and games" aria-label="Search local pages and games"><button>Search</button></form><button id="open-file">Open file</button><input id="file" type="file" hidden accept="image/*,audio/*,video/*,text/plain,.md,.json,.csv"></header>
  <main id="home-view"><div class="intro"><p class="eyebrow">YOUR LOCAL WORKSPACE</p><h1>Ready without Wi-Fi.</h1><p>Browse installed pages, play offline games, or preview a file from your device.</p></div><p id="status" role="status" aria-live="polite"></p><div id="cards" class="cards"></div><p class="note">Websites, online search engines, and live services are disabled in this local build. Your files remain on this device.</p></main>
  <section id="viewer" hidden><div class="viewer-heading"><strong id="viewer-title"></strong><button id="close-view">Close preview</button></div><div id="viewer-content"></div></section>
</body></html>
