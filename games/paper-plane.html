<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fullscreen Game</title>

<style>
  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
  }

  html,
  body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#061828;
  }

  iframe{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    border:none;
    display:block;
  }
</style>
</head>

<body>

<iframe
  src="https://script.google.com/macros/s/AKfycbxeDr9Vk86FP71BsmidKjWLI2ggEg_lQ-rqs6yWHhHu9GBw3IjZ0iVZSyKmRzgE32Jb/exec"
  allow="fullscreen; autoplay"
  allowfullscreen>
</iframe>

</body>
</html>
