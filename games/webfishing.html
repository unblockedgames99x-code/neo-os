<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<base href="https://cdn.jsdelivr.net/gh/genizy/web-port@main/web-fishing/">
<title>WEBFISHING</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
    touch-action: none;
  }

  #canvas {
    position: fixed;
    inset: 0;
    width: 100vw !important;
    height: 100vh !important;
    display: block;
    background: #000;
    outline: none;
  }

  #loader-screen {
    position: fixed;
    inset: 0;
    z-index: 999999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    color: #fff;
    text-align: center;
    padding: 22px;
  }

  #loader-card { width: min(540px, 92vw); }
  #loading-title { font-size: 24px; font-weight: 700; margin-bottom: 12px; }
  #loading-text { font-size: 15px; line-height: 1.45; opacity: 0.92; margin-bottom: 16px; }

  #bar {
    width: 100%;
    height: 16px;
    border-radius: 999px;
    background: #222;
    overflow: hidden;
    border: 1px solid #444;
  }

  #bar-fill {
    width: 0%;
    height: 100%;
    background: #fff;
    transition: width 0.2s linear;
  }

  #small-note { margin-top: 12px; font-size: 12px; opacity: 0.65; }

  #error-box {
    display: none;
    margin-top: 14px;
    padding: 10px;
    border: 1px solid #ff6666;
    border-radius: 10px;
    color: #ffb3b3;
    font-size: 13px;
    line-height: 1.4;
    word-break: break-word;
  }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0">
  HTML5 canvas appears to be unsupported in this browser.
</canvas>

<div id="loader-screen">
  <div id="loader-card">
    <div id="loading-title">Loading game...</div>
    <div id="loading-text">Downloading WEBFISHING files. Do not refresh.</div>
    <div id="bar"><div id="bar-fill"></div></div>
    <div id="small-note">Merging the split .pck file, then starting Godot WebGL...</div>
    <div id="error-box"></div>
  </div>
</div>

<script>
(() => {
  const BASE = "https://cdn.jsdelivr.net/gh/genizy/web-port@main/web-fishing/";
  const PCK_SIZE = 45948464;
  const WASM_SIZE = 17860295;
  const TOTAL_BYTES = PCK_SIZE + WASM_SIZE;

  const canvas = document.getElementById("canvas");
  const loaderScreen = document.getElementById("loader-screen");
  const loadingText = document.getElementById("loading-text");
  const barFill = document.getElementById("bar-fill");
  const errorBox = document.getElementById("error-box");

  const originalFetch = window.fetch.bind(window);
  let pckBlobUrl = null;
  let preloadBytes = 0;
  let finished = false;

  function resizeCanvas() {
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
  }

  function formatMB(bytes) {
    return (bytes / (1024 * 1024)).toFixed(2) + " MB";
  }

  function updateBar(percent, text) {
    if (finished) return;
    barFill.style.width = Math.max(0, Math.min(100, percent)) + "%";
    if (text) loadingText.textContent = text;
  }

  function showError(message) {
    finished = true;
    errorBox.style.display = "block";
    errorBox.textContent = message;
    loadingText.textContent = "The game could not finish loading. The error is shown below.";
  }

  function getParts(file, start, end) {
    const parts = [];
    for (let i = start; i <= end; i++) {
      parts.push(BASE + file + ".part" + i);
    }
    return parts;
  }

  async function fetchPart(url) {
    const response = await originalFetch(url, { cache: "force-cache" });
    if (!response.ok) throw new Error("Missing part: " + url + " — HTTP " + response.status);

    if (!response.body || !response.body.getReader) {
      const buffer = await response.arrayBuffer();
      preloadBytes += buffer.byteLength;
      updateBar((preloadBytes / PCK_SIZE) * 72, `Downloading data... ${formatMB(preloadBytes)} / ${formatMB(PCK_SIZE)}`);
      return buffer;
    }

    const reader = response.body.getReader();
    const chunks = [];
    let received = 0;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      received += value.length;
      preloadBytes += value.length;
      updateBar((preloadBytes / PCK_SIZE) * 72, `Downloading data... ${formatMB(preloadBytes)} / ${formatMB(PCK_SIZE)}`);
    }

    const fullBuffer = new Uint8Array(received);
    let offset = 0;
    for (const chunk of chunks) {
      fullBuffer.set(chunk, offset);
      offset += chunk.length;
    }
    return fullBuffer.buffer;
  }

  async function mergePckParts() {
    const parts = getParts("webfishing.pck", 1, 3);
    const buffers = await Promise.all(parts.map(fetchPart));
    pckBlobUrl = URL.createObjectURL(new Blob(buffers, { type: "application/octet-stream" }));
  }

  function installPckFetchFix() {
    window.fetch = function(input, init) {
      const url = typeof input === "string" ? input : (input && input.url ? input.url : "");

      // The repo does not have a plain webfishing.pck file. It has webfishing.pck.part1-3.
      // When Godot asks for webfishing.pck, return our merged Blob instead.
      if (pckBlobUrl && url.endsWith("webfishing.pck")) {
        return originalFetch(pckBlobUrl);
      }

      return originalFetch(input, init);
    };
  }

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = src;
      script.onload = resolve;
      script.onerror = () => reject(new Error("Could not load script: " + src));
      document.head.appendChild(script);
    });
  }

  async function startGame() {
    try {
      resizeCanvas();
      updateBar(2, "Loading Godot engine...");

      await loadScript(BASE + "webfishing.js");

      if (typeof Engine === "undefined") {
        throw new Error("Godot Engine did not load.");
      }

      updateBar(6, "Downloading split game data...");
      await mergePckParts();
      installPckFetchFix();

      const GODOT_CONFIG = {
        args: [],
        canvasResizePolicy: 2,
        executable: BASE + "webfishing",
        experimentalVK: false,
        fileSizes: {
          [BASE + "webfishing.pck"]: PCK_SIZE,
          [BASE + "webfishing.wasm"]: WASM_SIZE,
          "webfishing.pck": PCK_SIZE,
          "webfishing.wasm": WASM_SIZE
        },
        focusCanvas: true,
        gdnativeLibs: []
      };

      const engine = new Engine(GODOT_CONFIG);

      if (!Engine.isWebGLAvailable()) {
        throw new Error("WebGL is not available in this browser.");
      }

      updateBar(74, "Starting Godot WebGL...");

      await engine.startGame({
        onProgress: function(current, total) {
          if (total > 0) {
            const enginePercent = current / total;
            updateBar(74 + enginePercent * 24, `Starting game... ${Math.round(74 + enginePercent * 24)}%`);
          } else {
            updateBar(80, "Starting game engine...");
          }
        }
      });

      finished = true;
      barFill.style.width = "100%";
      loadingText.textContent = "Done";
      setTimeout(() => {
        loaderScreen.style.display = "none";
        resizeCanvas();
        canvas.focus();
      }, 350);
    } catch (err) {
      showError(String(err && err.message ? err.message : err));
    }
  }

  window.addEventListener("resize", resizeCanvas);
  window.addEventListener("click", () => canvas.focus());
  window.addEventListener("keydown", () => canvas.focus());

  setTimeout(() => {
    if (!finished) loadingText.textContent = "Still loading... wait for the large game data to finish.";
  }, 12000);

  startGame();
})();
</script>
</body>
</html>
