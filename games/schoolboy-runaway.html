<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>SchoolBoy Runaway</title>

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
  }

  #unity-container {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #000;
  }

  #unity-canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: block;
    background: #000;
    outline: none;
  }

  #loader-screen {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    color: #fff;
    text-align: center;
    padding: 22px;
  }

  #loader-card {
    width: min(520px, 92vw);
  }

  #loading-title {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 12px;
  }

  #loading-text {
    font-size: 15px;
    line-height: 1.45;
    opacity: 0.9;
    margin-bottom: 16px;
  }

  #bar {
    width: 100%;
    height: 16px;
    border-radius: 999px;
    background: #222;
    overflow: hidden;
    border: 1px solid #444;
  }

  #bar-fill {
    width: 0%;
    height: 100%;
    background: #fff;
    transition: width 0.2s linear;
  }

  #small-note {
    margin-top: 12px;
    font-size: 12px;
    opacity: 0.65;
  }

  #error-box {
    display: none;
    margin-top: 14px;
    padding: 10px;
    border: 1px solid #ff6666;
    border-radius: 10px;
    color: #ffb3b3;
    font-size: 13px;
    word-break: break-word;
  }
</style>
</head>

<body>
<div id="unity-container">
  <canvas id="unity-canvas" tabindex="0"></canvas>
</div>

<div id="loader-screen">
  <div id="loader-card">
    <div id="loading-title">Loading game...</div>
    <div id="loading-text">This game is large, so the first load can take a while. Do not refresh.</div>
    <div id="bar"><div id="bar-fill"></div></div>
    <div id="small-note">Loading files and starting Unity WebGL...</div>
    <div id="error-box"></div>
  </div>
</div>

<script>
(() => {
  const BASE = "https://cdn.jsdelivr.net/gh/genizy/web-port@latest/schoolboy-runaway/";

  const canvas = document.getElementById("unity-canvas");
  const loaderScreen = document.getElementById("loader-screen");
  const loadingText = document.getElementById("loading-text");
  const barFill = document.getElementById("bar-fill");
  const errorBox = document.getElementById("error-box");

  let loadedBytes = 0;
  const totalBytes = 315673805;

  function showError(message) {
    errorBox.style.display = "block";
    errorBox.textContent = message;
    loadingText.textContent = "The game could not finish loading. The error is shown below.";
  }

  function formatSize(bytes) {
    if (bytes >= 1024 * 1024 * 1024) return (bytes / (1024 * 1024 * 1024)).toFixed(2) + " GB";
    if (bytes >= 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(2) + " MB";
    if (bytes >= 1024) return (bytes / 1024).toFixed(2) + " KB";
    return bytes + " B";
  }

  function setProgress(percent, text) {
    const safePercent = Math.max(0, Math.min(100, percent || 0));
    barFill.style.width = safePercent + "%";
    if (text) loadingText.textContent = text;
  }

  function getParts(file, count) {
    const parts = [];
    for (let i = 1; i <= count; i++) {
      parts.push(BASE + file + ".part" + i);
    }
    return parts;
  }

  async function fetchWithProgress(url) {
    const response = await fetch(url, { cache: "force-cache" });

    if (!response.ok) {
      throw new Error("Could not load: " + url + " — HTTP " + response.status);
    }

    if (!response.body || !response.body.getReader) {
      const buffer = await response.arrayBuffer();
      loadedBytes += buffer.byteLength;
      const percent = (loadedBytes / totalBytes) * 100;
      setProgress(percent, `Loading... ${formatSize(loadedBytes)} / ${formatSize(totalBytes)} (${percent.toFixed(1)}%)`);
      return buffer;
    }

    const reader = response.body.getReader();
    const chunks = [];
    let received = 0;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      received += value.length;
      loadedBytes += value.length;
      chunks.push(value);

      const percent = (loadedBytes / totalBytes) * 100;
      setProgress(percent, `Loading... ${formatSize(loadedBytes)} / ${formatSize(totalBytes)} (${percent.toFixed(1)}%)`);
    }

    const fullBuffer = new Uint8Array(received);
    let offset = 0;

    for (const chunk of chunks) {
      fullBuffer.set(chunk, offset);
      offset += chunk.length;
    }

    return fullBuffer.buffer;
  }

  async function mergeFiles(parts) {
    const buffers = await Promise.all(parts.map(fetchWithProgress));
    return URL.createObjectURL(new Blob(buffers));
  }

  async function startGame() {
    try {
      setProgress(1, "Downloading game files... this can take a while on a Chromebook.");

      const dataParts = getParts("Build/schoolboy-runaway.data", 14);
      const wasmParts = getParts("Build/schoolboy-runaway.wasm", 2);

      const [dataUrl, wasmUrl] = await Promise.all([
        mergeFiles(dataParts),
        mergeFiles(wasmParts)
      ]);

      setProgress(96, "Starting Unity...");

      const config = {
        dataUrl: dataUrl,
        frameworkUrl: BASE + "Build/schoolboy-runaway.framework.js",
        codeUrl: wasmUrl,
        streamingAssetsUrl: BASE + "StreamingAssets",
        companyName: "Linked Squad",
        productName: "SchoolBoy Runaway",
        productVersion: "0.500",
        devicePixelRatio: 1,
        showBanner: function(msg, type) {
          if (type === "error") showError(msg);
          else console.warn(msg);
        }
      };

      const script = document.createElement("script");
      script.src = BASE + "Build/schoolboy-runaway.loader.js";

      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          const pct = 96 + progress * 4;
          setProgress(pct, `Starting Unity... ${Math.round(pct)}%`);
        }).then(() => {
          loaderScreen.style.display = "none";
          canvas.focus();
        }).catch((err) => {
          showError(String(err));
        });
      };

      script.onerror = () => showError("Could not load the Unity loader file.");
      document.body.appendChild(script);

    } catch (err) {
      showError(String(err && err.message ? err.message : err));
    }
  }

  window.addEventListener("click", () => canvas.focus());
  startGame();
})();
</script>
</body>
</html>
