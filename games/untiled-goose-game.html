<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Untitled Goose Game</title>

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
  }

  #unity-container {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #000;
  }

  #unity-canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: block;
    background: #000;
    outline: none;
  }

  #loader-screen {
    position: fixed;
    inset: 0;
    z-index: 999999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    color: #fff;
    text-align: center;
    padding: 22px;
  }

  #loader-card {
    width: min(540px, 92vw);
  }

  #loading-title {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 12px;
  }

  #loading-text {
    font-size: 15px;
    line-height: 1.45;
    opacity: 0.92;
    margin-bottom: 16px;
  }

  #bar {
    width: 100%;
    height: 16px;
    border-radius: 999px;
    background: #222;
    overflow: hidden;
    border: 1px solid #444;
  }

  #bar-fill {
    width: 0%;
    height: 100%;
    background: #fff;
    transition: width 0.2s linear;
  }

  #small-note {
    margin-top: 12px;
    font-size: 12px;
    opacity: 0.65;
  }

  #error-box {
    display: none;
    margin-top: 14px;
    padding: 10px;
    border: 1px solid #ff6666;
    border-radius: 10px;
    color: #ffb3b3;
    font-size: 13px;
    line-height: 1.4;
    word-break: break-word;
  }
</style>
</head>

<body>
<div id="unity-container">
  <canvas id="unity-canvas" tabindex="0"></canvas>
</div>

<div id="loader-screen">
  <div id="loader-card">
    <div id="loading-title">Loading game...</div>
    <div id="loading-text">This game is large, so the first load can take a while. Do not refresh.</div>
    <div id="bar"><div id="bar-fill"></div></div>
    <div id="small-note">Downloading files and starting Unity WebGL...</div>
    <div id="error-box"></div>
  </div>
</div>

<script>
(() => {
  const BASE = "https://cdn.jsdelivr.net/gh/web-ports/untitled-goose-game@main/";
  const TOTAL_MB = 95.69;

  const canvas = document.getElementById("unity-canvas");
  const loaderScreen = document.getElementById("loader-screen");
  const loadingText = document.getElementById("loading-text");
  const barFill = document.getElementById("bar-fill");
  const errorBox = document.getElementById("error-box");

  let loadedBytes = 0;

  function showError(message) {
    errorBox.style.display = "block";
    errorBox.textContent = message;
    loadingText.textContent = "The game could not finish loading. The error is shown below.";
  }

  window.addEventListener("error", (event) => {
    showError(event.message || "Unknown loading error.");
  });

  window.addEventListener("unhandledrejection", (event) => {
    showError(String(event.reason && event.reason.message ? event.reason.message : event.reason));
  });

  function setProgress(percent, text) {
    const safePercent = Math.max(0, Math.min(100, percent || 0));
    barFill.style.width = safePercent + "%";
    if (text) loadingText.textContent = text;
  }

  function resizeCanvas() {
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
  }

  function getParts(file, start, end) {
    const parts = [];
    for (let i = start; i <= end; i++) {
      parts.push(BASE + file + ".part" + i);
    }
    return parts;
  }

  async function fetchWithProgress(url) {
    const response = await fetch(url, { cache: "force-cache" });

    if (!response.ok) {
      throw new Error("Could not load " + url + " — HTTP " + response.status);
    }

    if (!response.body || !response.body.getReader) {
      const buffer = await response.arrayBuffer();
      loadedBytes += buffer.byteLength;
      const mbDone = (loadedBytes / (1024 * 1024)).toFixed(2);
      const percent = Math.min((mbDone / TOTAL_MB) * 94, 94);
      setProgress(percent, `Loading... ${mbDone} MB / ${TOTAL_MB} MB`);
      return buffer;
    }

    const reader = response.body.getReader();
    const chunks = [];
    let received = 0;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      received += value.length;
      loadedBytes += value.length;
      chunks.push(value);

      const mbDone = (loadedBytes / (1024 * 1024)).toFixed(2);
      const percent = Math.min((mbDone / TOTAL_MB) * 94, 94);
      setProgress(percent, `Loading... ${mbDone} MB / ${TOTAL_MB} MB`);
    }

    const fullBuffer = new Uint8Array(received);
    let offset = 0;

    for (const chunk of chunks) {
      fullBuffer.set(chunk, offset);
      offset += chunk.length;
    }

    return fullBuffer.buffer;
  }

  async function mergeFiles(fileParts, mimeType) {
    const buffers = await Promise.all(fileParts.map(fetchWithProgress));
    return URL.createObjectURL(new Blob(buffers, { type: mimeType || "application/octet-stream" }));
  }

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = src;
      script.onload = resolve;
      script.onerror = () => reject(new Error("Could not load script: " + src));
      document.body.appendChild(script);
    });
  }

  async function startGame() {
    try {
      resizeCanvas();
      window.addEventListener("resize", resizeCanvas);

      setProgress(1, "Downloading game files...");

      const [dataUrl, wasmUrl] = await Promise.all([
        mergeFiles(getParts("Build/Untitled%20Goose%20Game.data", 1, 4), "application/octet-stream"),
        mergeFiles(getParts("Build/Untitled%20Goose%20Game.wasm", 1, 2), "application/wasm")
      ]);

      setProgress(95, "Loading Unity engine...");

      await loadScript(BASE + "Build/Untitled%20Goose%20Game.loader.js");

      const config = {
        arguments: [],
        dataUrl: dataUrl,
        frameworkUrl: BASE + "Build/Untitled%20Goose%20Game.framework.js",
        codeUrl: wasmUrl,
        streamingAssetsUrl: BASE + "StreamingAssets",
        companyName: "House House & Bog",
        productName: "Untitled Goose Game",
        productVersion: "0.2",
        devicePixelRatio: 1,
        showBanner: function(msg, type) {
          if (type === "error") showError(msg);
          else console.warn(msg);
        }
      };

      setProgress(97, "Starting Unity...");

      createUnityInstance(canvas, config, (progress) => {
        const pct = 97 + (progress || 0) * 3;
        setProgress(pct, "Starting Unity... " + Math.round(pct) + "%");
      }).then(() => {
        setProgress(100, "Done");
        setTimeout(() => {
          loaderScreen.style.display = "none";
          resizeCanvas();
          canvas.focus();
        }, 300);
      }).catch((err) => {
        showError(String(err && err.message ? err.message : err));
      });

    } catch (err) {
      showError(String(err && err.message ? err.message : err));
    }
  }

  window.addEventListener("click", () => canvas.focus());
  startGame();
})();
</script>
</body>
</html>
