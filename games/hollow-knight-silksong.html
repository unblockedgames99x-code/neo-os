<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
    font-family: Arial, sans-serif;
  }

  #gameCrop {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: black;
  }

  #gameFrame {
    position: absolute;
    left: 0;
    top: -84px; /* removes red bar */
    width: 100vw;
    height: calc(100vh + 84px);
    border: none;
    background: black;
  }

  #loadingBox {
    position: fixed;
    left: 50%;
    bottom: 30px;
    transform: translateX(-50%);
    width: 420px;
    max-width: 90vw;
    background: rgba(0, 0, 0, 0.85);
    color: white;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 14px;
    padding: 16px;
    z-index: 999999;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  }

  #loadingTitle {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 8px;
  }

  #loadingTime {
    font-size: 14px;
    opacity: 0.9;
    margin-bottom: 12px;
  }

  #bar {
    width: 100%;
    height: 12px;
    background: #333;
    border-radius: 999px;
    overflow: hidden;
  }

  #barFill {
    width: 0%;
    height: 100%;
    background: white;
    transition: width 0.4s linear;
  }

  #hideLoader {
    margin-top: 12px;
    background: white;
    color: black;
    border: none;
    border-radius: 10px;
    padding: 8px 14px;
    font-weight: bold;
    cursor: pointer;
  }
</style>
</head>

<body>

<div id="gameCrop">
  <iframe
    id="gameFrame"
    src="https://gn-math.dev/?id=771"
    allow="fullscreen; autoplay; gamepad; keyboard-map; pointer-lock"
    allowfullscreen>
  </iframe>
</div>

<div id="loadingBox">
  <div id="loadingTitle">Loading game...</div>
  <div id="loadingTime">Estimated time left: calculating...</div>
  <div id="bar">
    <div id="barFill"></div>
  </div>
  <button id="hideLoader" onclick="document.getElementById('loadingBox').style.display='none'">
    Hide
  </button>
</div>

<script>
  /*
    Change this number if you want.
    180 = 3 minutes estimated loading time.
    Big Unity games may take longer the first time.
  */
  const ESTIMATED_SECONDS = 180;

  const loadingTitle = document.getElementById("loadingTitle");
  const loadingTime = document.getElementById("loadingTime");
  const barFill = document.getElementById("barFill");
  const frame = document.getElementById("gameFrame");

  let startTime = Date.now();
  let iframeLoaded = false;

  frame.addEventListener("load", () => {
    iframeLoaded = true;
    loadingTitle.textContent = "Game page loaded...";
  });

  function formatTime(seconds) {
    seconds = Math.max(0, Math.ceil(seconds));
    const min = Math.floor(seconds / 60);
    const sec = seconds % 60;

    if (min <= 0) return sec + " seconds";
    return min + " min " + sec + " sec";
  }

  function updateLoader() {
    const elapsed = (Date.now() - startTime) / 1000;
    const remaining = ESTIMATED_SECONDS - elapsed;

    let percent = Math.min(99, (elapsed / ESTIMATED_SECONDS) * 100);

    if (remaining <= 0) {
      percent = 100;
      loadingTitle.textContent = iframeLoaded
        ? "Almost ready..."
        : "Still loading...";
      loadingTime.textContent = "Taking longer than expected. Keep waiting or press Hide.";
    } else {
      loadingTime.textContent = "Estimated time left: " + formatTime(remaining);
    }

    barFill.style.width = percent + "%";

    requestAnimationFrame(updateLoader);
  }

  updateLoader();
</script>

</body>
</html>
