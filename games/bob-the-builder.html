<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fullscreen Game</title>

<style>
  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
  }

  html,
  body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#061828;
  }

  #game-wrap{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    overflow:hidden;
  }

  iframe{
    position:fixed;
    top:0;
    left:0;

    width:100vw;
    height:100vh;

    border:none;
    display:block;
  }
</style>
</head>

<body>

<div id="game-wrap">
  <iframe
    src="https://script.google.com/macros/s/AKfycbxTQQu2fOMiiFIrBQ-aYQgv_dRs6EnrwUCzPOyZevt8lHR7SVtRmO5jPY3HZpoZLeOLyA/exec"
    allow="fullscreen; autoplay"
    allowfullscreen>
  </iframe>
</div>

</body>
</html>
