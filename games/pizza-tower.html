<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
    font-family: Arial, sans-serif;
  }

  #gameCrop {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: black;
  }

  #gameFrame {
    position: absolute;
    left: 0;
    top: -84px;
    width: 100vw;
    height: calc(100vh + 84px);
    border: none;
    background: black;
  }

  #loadingMessage {
    position: fixed;
    left: 50%;
    bottom: 30px;
    transform: translateX(-50%);
    width: 430px;
    max-width: 90vw;
    background: rgba(0, 0, 0, 0.88);
    color: white;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 14px;
    padding: 16px;
    z-index: 999999;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  }

  #loadingMessage h3 {
    margin: 0 0 8px;
    font-size: 18px;
  }

  #loadingMessage p {
    margin: 0;
    font-size: 14px;
    line-height: 1.4;
    opacity: 0.95;
  }

  #hideMessage {
    margin-top: 12px;
    background: white;
    color: black;
    border: none;
    border-radius: 10px;
    padding: 8px 14px;
    font-weight: bold;
    cursor: pointer;
  }
</style>
</head>

<body>

<div id="gameCrop">
  <iframe
    id="gameFrame"
    src="https://gn-math.dev/?id=267"
    allow="fullscreen; autoplay; gamepad; keyboard-map; pointer-lock"
    allowfullscreen>
  </iframe>
</div>

<div id="loadingMessage">
  <h3>Game is loading...</h3>
  <p>This game can take a long time to load, especially on a school Chromebook. Just wait and do not refresh.</p>
  <button id="hideMessage" onclick="document.getElementById('loadingMessage').style.display='none'">
    Hide
  </button>
</div>

</body>
</html>
