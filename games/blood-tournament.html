<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tournament Game</title>

<script src="https://cdn.jsdelivr.net/gh/lee2sman/everyday@d45d601d2c4d60adf809a0b677c00b7d12aba7e9/96/TemplateData/UnityProgress.js"></script>
<script src="https://cdn.jsdelivr.net/gh/gertdoro/UnityExplorer@1f215ed00a0aea8ae8f5fcb08225aae94a9266cf/Loader/Standalone/tournament/tournament.js"></script>

<style>
  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
  }

  html,
  body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#231f20;
  }

  .webgl-content,
  #gameContainer{
    position:fixed !important;
    inset:0 !important;
    width:100vw !important;
    height:100vh !important;
    margin:0 !important;
    padding:0 !important;
    border:0 !important;
    background:#231f20 !important;
  }

  canvas{
    width:100vw !important;
    height:100vh !important;
    display:block !important;
  }
</style>
</head>

<body>
  <div class="webgl-content">
    <div id="gameContainer"></div>
  </div>

  <script>
    var gameInstance = UnityLoader.instantiate(
      "gameContainer",
      "https://cdn.jsdelivr.net/gh/gertdoro/UnityExplorer@8c62a3874c1ef1607f7655eba72ffa55ad79107b/Loader/Standalone/tournament/tournament.json",
      {
        onProgress: UnityProgress,
        Module: {
          onRuntimeInitialized: function () {
            UnityProgress(gameInstance, "complete");
          }
        }
      }
    );
  </script>
</body>
</html>
