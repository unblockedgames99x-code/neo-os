<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>DOOM</title>

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fedb1d;
    font-family: Arial, sans-serif;
  }

  #canvas {
    position: fixed;
    inset: 0;
    width: 100vw !important;
    height: 100vh !important;
    display: block;
    background: #000;
    outline: none;
  }

  .emularity-splash-screen {
    text-align: center;
    position: fixed !important;
    inset: 0 !important;
    margin: 0 !important;
    color: #fedb1d !important;
    background: #000 !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
  }

  #loader-screen {
    position: fixed;
    inset: 0;
    z-index: 999999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    color: #fff;
    text-align: center;
    padding: 22px;
  }

  #loader-card {
    width: min(540px, 92vw);
  }

  #loading-title {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 12px;
  }

  #loading-text {
    font-size: 15px;
    line-height: 1.45;
    opacity: 0.92;
    margin-bottom: 16px;
  }

  #bar {
    width: 100%;
    height: 16px;
    border-radius: 999px;
    background: #222;
    overflow: hidden;
    border: 1px solid #444;
  }

  #bar-fill {
    width: 0%;
    height: 100%;
    background: #fff;
    transition: width 0.25s linear;
  }

  #small-note {
    margin-top: 12px;
    font-size: 12px;
    opacity: 0.65;
  }

  #error-box {
    display: none;
    margin-top: 14px;
    padding: 10px;
    border: 1px solid #ff6666;
    border-radius: 10px;
    color: #ffb3b3;
    font-size: 13px;
    line-height: 1.4;
    word-break: break-word;
  }
</style>
</head>

<body>
<canvas id="canvas" onclick="window.focus();" tabindex="0"></canvas>

<div id="loader-screen">
  <div id="loader-card">
    <div id="loading-title">Loading DOOM...</div>
    <div id="loading-text">Starting DOSBox. Do not refresh.</div>
    <div id="bar"><div id="bar-fill"></div></div>
    <div id="small-note">Click the game once after it loads so keyboard controls work.</div>
    <div id="error-box"></div>
  </div>
</div>

<script>
(() => {
  const BASE = "https://fastly.jsdelivr.net/gh/bubbls/dosbox@main/";
  const GAME_ZIP = BASE + "softs/DOOM.zip";
  const GAME_EXE = "DOOM/DOOM.EXE";

  const canvas = document.getElementById("canvas");
  const loaderScreen = document.getElementById("loader-screen");
  const loadingText = document.getElementById("loading-text");
  const barFill = document.getElementById("bar-fill");
  const errorBox = document.getElementById("error-box");

  let hidden = false;

  function setProgress(percent, text) {
    barFill.style.width = Math.max(0, Math.min(100, percent)) + "%";
    if (text) loadingText.textContent = text;
  }

  function showError(message) {
    errorBox.style.display = "block";
    errorBox.textContent = String(message || "Unknown loading error");
    loadingText.textContent = "The game could not finish loading. The error is shown below.";
    barFill.style.width = "100%";
  }

  function fitCanvas() {
    canvas.style.width = "100vw";
    canvas.style.height = "100vh";
    canvas.style.display = "block";
    canvas.setAttribute("tabindex", "0");
  }

  function hideLoaderSoon() {
    if (hidden) return;
    hidden = true;
    setProgress(100, "Loaded.");
    setTimeout(() => {
      loaderScreen.style.display = "none";
      fitCanvas();
      canvas.focus();
    }, 700);
  }

  function loadScript(src, percent, label) {
    return new Promise((resolve, reject) => {
      setProgress(percent, label);
      const script = document.createElement("script");
      script.src = src;
      script.async = false;
      script.onload = resolve;
      script.onerror = () => reject(new Error("Could not load script: " + src));
      document.body.appendChild(script);
    });
  }

  function locateAdditionalFiles(filename) {
    if (filename === "dosbox.html.mem") {
      return BASE + "js/dosbox-sync.mem";
    }
    return BASE + "js/" + filename;
  }

  async function startGame() {
    try {
      fitCanvas();

      await loadScript(BASE + "js/es6-promise.js", 15, "Loading Promise support...");
      await loadScript(BASE + "js/browserfs.min.js", 30, "Loading file system...");
      await loadScript(BASE + "js/loader.js", 45, "Loading DOSBox loader...");
      await loadScript("https://code.jquery.com/jquery-2.1.1.min.js", 55, "Loading support library...");

      if (typeof Emulator === "undefined" || typeof DosBoxLoader === "undefined") {
        throw new Error("DOSBox loader did not initialize.");
      }

      setProgress(65, "Mounting DOOM files...");

      const dosbox = new Emulator(
        canvas,
        null,
        new DosBoxLoader(
          DosBoxLoader.emulatorJS(BASE + "js/dosbox-sync.js"),
          DosBoxLoader.locateAdditionalEmulatorJS(locateAdditionalFiles),
          DosBoxLoader.nativeResolution(640, 400),
          DosBoxLoader.mountZip(
            "c",
            DosBoxLoader.fetchFile("DOOM", GAME_ZIP)
          ),
          DosBoxLoader.startExe(GAME_EXE)
        )
      );

      setProgress(80, "Starting DOOM...");

      dosbox.start({
        waitAfterDownloading: false
      });

      // DOSBox does not always report when it is ready, so hide after startup begins.
      setTimeout(() => {
        setProgress(95, "Almost ready...");
      }, 2500);

      setTimeout(hideLoaderSoon, 6000);

      setTimeout(() => {
        if (!hidden) {
          loadingText.textContent = "Still loading DOSBox. Keep waiting.";
        }
      }, 12000);

    } catch (err) {
      showError(err && err.message ? err.message : err);
    }
  }

  window.addEventListener("resize", fitCanvas);
  window.addEventListener("click", () => {
    window.focus();
    canvas.focus();
  });

  startGame();
})();
</script>
</body>
</html>
