<div style="position:fixed; inset:0; width:100vw; height:100vh; margin:0; padding:0; overflow:hidden; background:#061828;">
  <iframe
    id="gameFrame"
    src="https://script.google.com/macros/s/AKfycbzqlsUlzvLcAqYTv4bkHpIhkKxD0LqxdGm0urhWYbpfBKP6gY40w1UPpXW2efqA5JHG/exec"
    style="position:absolute; inset:0; width:100%; height:100%; border:0;"
    allowfullscreen
    tabindex="0">
  </iframe>
</div>

<script>
const frame = document.getElementById("gameFrame");

function focusFrame() {
  frame.focus();
}

window.onload = () => {
  focusFrame();
};

document.addEventListener("click", focusFrame);

const keyMap = {
  w: "ArrowUp",
  a: "ArrowLeft",
  s: "ArrowDown",
  d: "ArrowRight"
};

function cloneKey(type, originalKey) {
  const mapped = keyMap[originalKey.toLowerCase()];
  if (!mapped) return;

  const event = new KeyboardEvent(type, {
    key: mapped,
    code: mapped,
    keyCode:
      mapped === "ArrowUp" ? 38 :
      mapped === "ArrowLeft" ? 37 :
      mapped === "ArrowDown" ? 40 : 39,
    which:
      mapped === "ArrowUp" ? 38 :
      mapped === "ArrowLeft" ? 37 :
      mapped === "ArrowDown" ? 40 : 39,
    bubbles: true
  });

  document.dispatchEvent(event);
  window.dispatchEvent(event);

  try {
    frame.contentWindow.dispatchEvent(event);
  } catch(e) {}
}

document.addEventListener("keydown", (e) => {
  cloneKey("keydown", e.key);
});

document.addEventListener("keyup", (e) => {
  cloneKey("keyup", e.key);
});
</script>
