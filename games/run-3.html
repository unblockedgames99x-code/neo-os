<!DOCTYPE html>
<html>
<head>
  <base target="_blank">
</head>
<body>
<div id="container">
  <iframe width="100%" height="100%" src="https://lekug.github.io/tn6pS9dCf37xAhkJv/" frameborder="0" allowfullscreen></iframe>
</div>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;

  #container {
    width: 100vw;
    height: 100vh;
  }

    display: block;
    width: 100%;
    height: 100%;

  }

</html>
