<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    #container {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
    }

    ruffle-player {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
  </style>

  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

  <script>
    window.RufflePlayer = window.RufflePlayer || {};

    window.RufflePlayer.config = {
      autoplay: "off",
      splashScreen: true,
      scale: "exactFit",
      letterbox: "off",
      allowFullscreen: true,
      forceScale: true,
      forceAlign: true,
      quality: "high",
      backgroundColor: "#000000"
    };

    window.addEventListener("load", function () {
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();

      const container = document.getElementById("container");
      container.appendChild(player);

      player.style.width = "100%";
      player.style.height = "100%";

      player.load("https://cdn.jsdelivr.net/gh/oldflashgames/games5@f69d51566fc54fb2e586bfd79ed83522327d6202/street-fighter-2.swf");
    });
  </script>
</head>

<body>
  <div id="container"></div>
</body>
</html>
