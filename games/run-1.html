<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script type="text/javascript" async src="https://www.googletagmanager.com/gtag/js?id=G-F32JC4N3VY"></script>
<script type="text/javascript" id="analytics" async src="https://cdn.jsdelivr.net/gh/st39/sdk@main/ga.js"></script>
<script id="gamemonetize-sdk" src="https://cdn.jsdelivr.net/gh/st39/sdk@main/sdkjs.js"></script>
<script src="//www.google.com/jsapi"></script>
<script>window.parent.maeExportApis_ && window.parent.maeExportApis_();</script>
<script src="https://cdn.jsdelivr.net/gh/st39/sdk@main/api.js"></script>
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }

  #container {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
  }

  ruffle-player {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
<script>
window.RufflePlayer = window.RufflePlayer || {};
window.RufflePlayer.config = {
  autoplay: "on",
  polyfills: true,
  letterbox: "on",
  backgroundColor: null,
  scale: "showAll",
  allowFullscreen: true,
  forceScale: true,
  forceAlign: true,
  splashScreen: true,
  wmode: "Window",
  unmuteOverlay: "hidden",
  quality: "high"
};

window.addEventListener("load", () => {
  const ruffle = window.RufflePlayer.newest();
  const player = ruffle.createPlayer();
  const container = document.getElementById("container");
  container.appendChild(player);
  player.style.width = "100%";
  player.style.height = "100%";
  player.load("https://cdn.jsdelivr.net/gh/Avioso/strongdog@f85f28d947e1bb06696246f47ba446d02d56a33d/swf/run/run.swf");
});
</script>
</head>
<body>

<div id="container"></div>

<script>
window.SDK_OPTIONS = {
  gameId: "r2tzpy9cgrn2u4xgzc9z0zbtvxm16mby",
  onEvent: function(a) {
    switch(a.name) {
      case "SDK_GAME_PAUSE": break;
      case "SDK_GAME_START": break;
      case "SDK_READY": break;
    }
  }
};
(function(a,b,c){
  var d=a.getElementsByTagName(b)[0];
  a.getElementById(c)||(a=a.createElement(b),a.id=c,
  a.src="https://cdn.jsdelivr.net/gh/st39/sdk@main/sdkjs.js",
  d.parentNode.insertBefore(a,d));
})(document,"script","gamemonetize-sdk");

let isAdShown = false;
function onClick(e) {
  if (!isAdShown && typeof sdk !== 'undefined' && typeof sdk.showBanner === 'function') {
    sdk.showBanner();
    isAdShown = true;
  }
  window.removeEventListener("click", onClick);
}
window.addEventListener("click", onClick);
</script>

</body>
</html>
