    if (typeof idb.databases === "function") {
      const databases = await idb.databases();
      for (const database of databases) {
        if (database && database.name) {

          return;

    const records = [];
    for (const record of rawRecords) {
      records.push({
        key: await encodeNode(record.key),
        value: await encodeNode(record.value),

    }
    return records;

  async function exportIndexedDBDatabase(databaseInfo) {

      version: db.version || databaseInfo.version || 1,
      stores: [],

            name: index.name,
            keyPath: index.keyPath,
            unique: index.unique,
            multiEntry: index.multiEntry,

        await done;
        snapshot.stores.push({
          name: store.name,
          keyPath: store.keyPath,
          autoIncrement: store.autoIncrement,
          indexes,

  async function findExistingDatabaseVersion(name) {

    const databases = await idb.databases();
    const match = databases.find((database) => database && database.name === name);
    return match && match.version ? match.version : null;

  function applySchema(db, databaseSnapshot, upgradeTransaction) {

      } else {

        if (storeSnapshot.keyPath !== null && storeSnapshot.keyPath !== undefined) {

        store = db.createObjectStore(storeSnapshot.name, options);

        if (!store.indexNames.contains(indexSnapshot.name)) {
          store.createIndex(indexSnapshot.name, indexSnapshot.keyPath, {
            unique: !!indexSnapshot.unique,
            multiEntry: !!indexSnapshot.multiEntry,
          });
        }

    }

    const existingVersion = await findExistingDatabaseVersion(databaseSnapshot.name);
    const firstVersion = Math.max(snapshotVersion, existingVersion || 0) || 1;
    let db = await openDatabase(databaseSnapshot.name, firstVersion, (database, event) => {

    db.close();
    db = await openDatabase(databaseSnapshot.name, nextVersion, (database, event) => {
      applySchema(database, databaseSnapshot, event.target.transaction);
    });
    return db;

      for (const record of storeSnapshot.records || []) {

          key: decodeNode(record.key),
          value: decodeNode(record.value),

    const storeNames = stores.map((store) => store.name).filter((name) => db.objectStoreNames.contains(name));

    if (!storeNames.length) {

      return;

    try {
      const transaction = db.transaction(storeNames, "readwrite");
      for (const storeSnapshot of stores) {

    setStatus(warnings.length ? `Loaded with ${warnings.length} warning(s). Reloading...` : "Loaded. Reloading...");
    setTimeout(() => location.reload(), 500);
    return warnings;
  }

  function createUI() {
    if (!config.showUI || document.getElementById("hard-save-panel")) return;

    const style = document.createElement("style");
    style.textContent = `
      #hard-save-panel {
        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px;
        border: 1px solid rgba(255,255,255,.24);
        border-radius: 8px;
        background: rgba(16,16,16,.82);
        color: #fff;
        font: 13px/1.2 Arial, sans-serif;
        box-shadow: 0 8px 24px rgba(0,0,0,.35);
      }
      #hard-save-panel button {
        min-width: 72px;
        min-height: 34px;
        border: 0;
        border-radius: 6px;
        background: #f4d35e;
        color: #151515;
        cursor: pointer;
        font: 700 13px/1 Arial, sans-serif;
      }
      #hard-save-panel button:hover { background: #ffe27a; }
      #hard-save-panel button:active { transform: translateY(1px); }
      #hard-save-status {
        max-width: 220px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: #dce7ff;
      }
      #hard-save-status[data-error="true"] { color: #ffb8b8; }
    `;

    const panel = document.createElement("div");
    panel.id = "hard-save-panel";
    panel.innerHTML = `
      <button type="button" id="hard-save-export" title="Download a portable save file">Save File</button>
      <button type="button" id="hard-save-import" title="Load a portable save file">Load File</button>
      <span id="hard-save-status" aria-live="polite"></span>
      <input type="file" id="hard-save-file" accept="application/json,.json" hidden>
    `;

    for (const eventName of ["pointerdown", "pointerup", "click", "keydown", "keyup"]) {
      panel.addEventListener(eventName, (event) => event.stopPropagation(), true);
    }

    document.head.appendChild(style);
    document.body.appendChild(panel);
    statusNode = document.getElementById("hard-save-status");

    const saveButton = document.getElementById("hard-save-export");
    const loadButton = document.getElementById("hard-save-import");
    const fileInput = document.getElementById("hard-save-file");

    saveButton.addEventListener("click", async () => {
      try {
        await exportToFile();
      } catch (error) {
        setStatus(error.message, true);
      }
    });

    loadButton.addEventListener("click", () => {
      const ok = confirm("Load this save file? This replaces the current browser save data for this page and then reloads.");
      if (ok) fileInput.click();
    });

    fileInput.addEventListener("change", async () => {
      const [file] = fileInput.files || [];
      fileInput.value = "";
      if (!file) return;
      try {
        await importFromFile(file);
      } catch (error) {
        setStatus(error.message, true);
      }
    });
  }

  window.HardSave = {
    exportSnapshot,
    exportToFile,
    importSnapshot,
    importFromFile,
  };

  if (document.body) {
    createUI();
  } else {
    document.addEventListener("DOMContentLoaded", createUI, { once: true });
  }
})();
