<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Baldi's Basics Plus</title>

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
  }

  #unity-container {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #000;
    overflow: hidden;
  }

  #unity-canvas {
    position: fixed;
    inset: 0;
    width: 100vw !important;
    height: 100vh !important;
    display: block;
    background: #231F20;
    outline: none;
  }

  #loader-screen {
    position: fixed;
    inset: 0;
    z-index: 999999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    color: #fff;
    text-align: center;
    padding: 22px;
  }

  #loader-card {
    width: min(560px, 92vw);
  }

  #loading-title {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 12px;
  }

  #loading-text {
    font-size: 15px;
    line-height: 1.45;
    opacity: 0.92;
    margin-bottom: 16px;
  }

  #bar {
    width: 100%;
    height: 16px;
    border-radius: 999px;
    background: #222;
    overflow: hidden;
    border: 1px solid #444;
  }

  #bar-fill {
    width: 0%;
    height: 100%;
    background: #fff;
    transition: width 0.2s linear;
  }

  #small-note {
    margin-top: 12px;
    font-size: 12px;
    opacity: 0.65;
  }

  #error-box {
    display: none;
    margin-top: 14px;
    padding: 10px;
    border: 1px solid #ff6666;
    border-radius: 10px;
    color: #ffb3b3;
    font-size: 13px;
    line-height: 1.4;
    word-break: break-word;
  }
</style>
</head>

<body>
<div id="unity-container">
  <canvas id="unity-canvas" tabindex="0"></canvas>
</div>

<div id="loader-screen">
  <div id="loader-card">
    <div id="loading-title">Loading Baldi's Basics Plus...</div>
    <div id="loading-text">Starting loader. Do not refresh.</div>
    <div id="bar"><div id="bar-fill"></div></div>
    <div id="small-note">This game is large. First load can take a while on Chromebooks.</div>
    <div id="error-box"></div>
  </div>
</div>

<script>
(() => {
  const BASE = "https://fastly.jsdelivr.net/gh/genizy/web-port@latest/baldi-plus/";
  const FALLBACK_TOTAL_BYTES = 315673805;

  const canvas = document.getElementById("unity-canvas");
  const loaderScreen = document.getElementById("loader-screen");
  const loadingText = document.getElementById("loading-text");
  const barFill = document.getElementById("bar-fill");
  const errorBox = document.getElementById("error-box");

  let loadedBytes = 0;
  let totalBytes = 0;
  let unityStarted = false;

  function showError(message) {
    errorBox.style.display = "block";
    errorBox.textContent = String(message || "Unknown loading error");
    loadingText.textContent = "The game could not finish loading. The error is shown below.";
    barFill.style.width = "100%";
  }

  function formatSize(bytes) {
    if (bytes >= 1024 * 1024 * 1024) return (bytes / (1024 * 1024 * 1024)).toFixed(2) + " GB";
    if (bytes >= 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(2) + " MB";
    if (bytes >= 1024) return (bytes / 1024).toFixed(2) + " KB";
    return bytes + " B";
  }

  function setProgress(percent, text) {
    const safePercent = Math.max(0, Math.min(100, percent || 0));
    barFill.style.width = safePercent + "%";
    if (text) loadingText.textContent = text;
  }

  function fitCanvas() {
    canvas.style.width = "100vw";
    canvas.style.height = "100vh";
    canvas.setAttribute("tabindex", "0");
  }

  function getParts(file, count) {
    const parts = [];
    for (let i = 1; i <= count; i++) {
      parts.push(BASE + file + ".part" + i);
    }
    return parts;
  }

  async function getSize(url) {
    try {
      const res = await fetch(url, { method: "HEAD", cache: "force-cache" });
      if (!res.ok) return 0;
      return Number(res.headers.get("content-length") || 0);
    } catch {
      return 0;
    }
  }

  async function fetchWithProgress(url) {
    const response = await fetch(url, { cache: "force-cache" });

    if (!response.ok) {
      throw new Error("Could not load: " + url + " — HTTP " + response.status);
    }

    if (!response.body || !response.body.getReader) {
      const buffer = await response.arrayBuffer();
      loadedBytes += buffer.byteLength;
      const percent = (loadedBytes / (totalBytes || FALLBACK_TOTAL_BYTES)) * 88;
      setProgress(percent, `Loading files... ${formatSize(loadedBytes)} / ${formatSize(totalBytes || FALLBACK_TOTAL_BYTES)}`);
      return buffer;
    }

    const reader = response.body.getReader();
    const chunks = [];
    let received = 0;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      chunks.push(value);
      received += value.length;
      loadedBytes += value.length;

      const percent = (loadedBytes / (totalBytes || FALLBACK_TOTAL_BYTES)) * 88;
      setProgress(percent, `Loading files... ${formatSize(loadedBytes)} / ${formatSize(totalBytes || FALLBACK_TOTAL_BYTES)}`);
    }

    const full = new Uint8Array(received);
    let offset = 0;

    for (const chunk of chunks) {
      full.set(chunk, offset);
      offset += chunk.length;
    }

    return full.buffer;
  }

  async function mergeFiles(parts, type) {
    const buffers = [];

    for (const part of parts) {
      buffers.push(await fetchWithProgress(part));
    }

    return URL.createObjectURL(new Blob(buffers, { type: type || "application/octet-stream" }));
  }

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = src;
      script.async = false;
      script.onload = resolve;
      script.onerror = () => reject(new Error("Could not load script: " + src));
      document.body.appendChild(script);
    });
  }

  async function startGame() {
    try {
      fitCanvas();
      setProgress(3, "Checking game files...");

      const dataParts = getParts("Build/BaldiPlusNew.data", 5);
      const wasmParts = getParts("Build/BaldiPlusNew.wasm", 2);
      const allParts = [...dataParts, ...wasmParts];

      const sizes = await Promise.all(allParts.map(getSize));
      totalBytes = sizes.reduce((sum, value) => sum + value, 0) || FALLBACK_TOTAL_BYTES;

      setProgress(6, "Downloading split game files...");

      const [dataUrl, wasmUrl] = await Promise.all([
        mergeFiles(dataParts, "application/octet-stream"),
        mergeFiles(wasmParts, "application/wasm")
      ]);

      setProgress(90, "Loading Unity engine...");

      await loadScript(BASE + "Build/BaldiPlusNew.loader.js");

      const config = {
        dataUrl: dataUrl,
        frameworkUrl: BASE + "Build/BaldiPlusNew.framework.js",
        codeUrl: wasmUrl,
        streamingAssetsUrl: BASE + "StreamingAssets",
        companyName: "Basically Games",
        productName: "Baldi's Basics Plus",
        productVersion: "0.12.2a",
        devicePixelRatio: 1,
        showBanner: function(msg, type) {
          if (type === "error") showError(msg);
          else console.warn(msg);
        }
      };

      setProgress(94, "Starting Unity...");

      createUnityInstance(canvas, config, (progress) => {
        const pct = 94 + progress * 6;
        setProgress(pct, "Starting Unity... " + Math.round(pct) + "%");
      }).then(() => {
        unityStarted = true;
        setProgress(100, "Loaded.");
        setTimeout(() => {
          loaderScreen.style.display = "none";
          fitCanvas();
          canvas.focus();
        }, 500);
      }).catch((err) => {
        showError(err && err.message ? err.message : err);
      });

      setTimeout(() => {
        if (!unityStarted) {
          loadingText.textContent = "Still loading Unity. This game is large, so keep waiting.";
        }
      }, 20000);

    } catch (err) {
      showError(err && err.message ? err.message : err);
    }
  }

  window.addEventListener("resize", fitCanvas);
  window.addEventListener("click", () => canvas.focus());

  startGame();
})();
</script>
</body>
</html>
