  <script>
    // ── Google Sites iframe safety fixes ──────────────────────────────────────
    try { window.onbeforeunload = () => "Are you sure you want to leave?"; } catch(e) {}

    // Mobile viewport fix
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {

    // ── Static menu hide/show ─────────────────────────────────────────────────
    (function(){
      const menu = document.getElementById("staticMenu");
      const btn  = document.getElementById("closeStaticMenu");
      const KEY  = "sq931_staticMenu_hidden_until";
      const show = () => { if (menu) menu.style.display = "flex"; };
      const hideFor3m = () => {
        if (!menu) return;
        menu.style.display = "none";
        const until = Date.now() + 180000;
        try { localStorage.setItem(KEY, String(until)); } catch(e) {}
        setTimeout(show, 180000);
      };
      let until = 0;
      try { until = parseInt(localStorage.getItem(KEY) || "0", 10); } catch(e) {}
      if (until && Date.now() < until) {
        if (menu) menu.style.display = "none";
        setTimeout(show, until - Date.now());
      }
      if (btn) btn.onclick = hideFor3m;
    })();

    // ── Slide menu rotation ───────────────────────────────────────────────────
    (function(){
      const wrap = document.getElementById("staticSlideMenu");
      const a    = document.getElementById("staticSlideLink");
      const img  = document.getElementById("staticSlideImg");
      const ROTATION = [
        { src: "https://cdn.jsdelivr.net/gh/StaticQuasar931/Images@main/GoogleForm.png",                                    alt: "StaticQuasar931 Google Form",  link: "https://sites.google.com/view/staticquasar931/google-form" },
        { src: "https://cdn.jsdelivr.net/gh/StaticQuasar931/Images@main/Join_Our_DC_StaticQuassar931_lcplrf.png",           alt: "Join our Discord",             link: "https://discord.gg/DP2hM7RRhR" },
        { src: "https://cdn.jsdelivr.net/gh/StaticQuasar931/Images@main/Follow-us--IG",                                     alt: "Follow on Instagram",          link: "https://www.instagram.com/freeschoolgamepage/" }
      ];
      ROTATION.forEach(o => { const p = new Image(); p.src = o.src; });
      let idx = 0;
      const delay = ms => new Promise(r => setTimeout(r, ms));
      function apply(s) {
        a.href = s.link; img.alt = s.alt; img.style.opacity = "0";
        setTimeout(() => { img.src = s.src; }, 80);
        img.onload = () => { img.style.opacity = "1"; };
      }
      (async function cycle() {
        for (;;) {
          apply(ROTATION[idx]);
          wrap.style.pointerEvents = "auto";
          wrap.classList.replace("slide-out", "slide-in");
          await delay(7000);
          wrap.classList.replace("slide-in", "slide-out");
          await delay(2000);
          wrap.style.pointerEvents = "none";
          await delay(20000);
          idx = (idx + 1) % ROTATION.length;
        }
      })();
    })();

    // ── YUI keyboard shortcut to toggle branding ──────────────────────────────
    (function(){
      let seq = [];
      window.addEventListener("keydown", e => {
        seq.push(e.key.toLowerCase());
        if (seq.length > 3) seq.shift();
        if (seq.join("") === "yui") {
          ["staticMenu","staticSlideMenu"].forEach(id => {
            const el = document.getElementById(id);
            if (!el) return;
            const hidden = el.style.display === "none" || getComputedStyle(el).display === "none";
            el.style.display = hidden ? (id === "staticMenu" ? "flex" : "block") : "none";
          });
        }
      });
    })();

    // ── Unity bridge stubs ────────────────────────────────────────────────────
    const canvas         = document.getElementById('canvas');
    const loadingOverlay = document.getElementById('loading-overlay');
    const progressFill   = document.getElementById('progress-bar-fill');
    const loadingStatus  = document.getElementById('loading-status');
    window.unityInstance = null;

    let fillInterval = null, fillStarted = false;

    function onProgress(p) {
      if (p >= 1) { clearInterval(fillInterval); fillInterval = null; return; }
      if (fillStarted) return;
      if (p >= 0.9) { fillStarted = true; animateFill(); return; }
      if (progressFill) progressFill.style.width = (p * 100) + '%';
      if (loadingStatus) loadingStatus.textContent = 'Loading... ' + Math.round(p * 100) + '%';
    }

    function animateFill() {
      if (fillInterval) return;
      let pct = 90;
      if (progressFill) progressFill.style.width = pct + '%';
      fillInterval = setInterval(() => {
        if (++pct >= 100) { pct = 100; clearInterval(fillInterval); fillInterval = null; }
        if (progressFill) progressFill.style.width = pct + '%';
      }, 100);
    }

    window.addEventListener('pointerdown', () => {
      try { window.focus(); canvas.focus(); } catch(e) {}
    });

    function msg(name, value) {
      if (window.unityInstance?.SendMessage) window.unityInstance.SendMessage('PlaygamaBridge', name, value || '');
    }
    const bool = v => v ? 'true' : 'false';

    // Platform stubs
    window.getPlatformId = () => '';
    window.getPlatformLanguage = () => 'en';
    window.getPlatformPayload = () => '';
    window.getPlatformTld = () => '';
    window.sendMessageToPlatform = () => {};
    window.getServerTime = () => msg('OnGetServerTimeCompleted', Date.now().toString());
    window.getDeviceType = () => 'desktop';
    window.getVisibilityState = () => 'visible';

    // Auth stubs
    window.getIsPlayerAuthorizationSupported = () => bool(false);
    window.getIsPlayerAuthorized = () => bool(false);
    window.getPlayerId = () => '';
    window.getPlayerName = () => '';

    window.authorizePlayer = () => msg('OnAuthorizeCompleted', bool(false));

    // Storage stubs
    window.getStorageDefaultType = () => 'local';
    window.getIsStorageSupported = () => bool(true);
    window.getIsStorageAvailable = () => bool(true);
    window.getStorageData = k => msg('OnGetStorageDataSuccess', `${k}{bridge_data_separator}`);
    window.setStorageData = k => msg('OnSetStorageDataSuccess', k);
    window.deleteStorageData = k => msg('OnDeleteStorageDataSuccess', k);

    window.getIsCreatePostSupported = () => bool(false);

    window.share = () => msg('OnShareCompleted', bool(false));
    window.inviteFriends = () => msg('OnInviteFriendsCompleted', bool(false));
    window.joinCommunity = () => msg('OnJoinCommunityCompleted', bool(false));
    window.createPost = () => msg('OnCreatePostCompleted', bool(false));
    window.addToHomeScreen = () => msg('OnAddToHomeScreenCompleted', bool(false));
    window.addToFavorites = () => msg('OnAddToFavoritesCompleted', bool(false));
    window.rate = () => msg('OnRateCompleted', bool(false));

    // Leaderboard stubs
    window.getIsLeaderboardSupported = () => bool(false);
    window.getIsLeaderboardNativePopupSupported = () => bool(false);
    window.getIsLeaderboardSetScoreSupported = () => bool(false);

    // Payments stubs

    window.getIsPurchaseConsumingSupported = () => bool(false);

    window.paymentsGetCatalog = () => msg('OnPaymentsGetCatalogCompletedSuccess', '[]');
    window.paymentsGetPurchases = () => msg('OnPaymentsGetPurchasesCompletedSuccess', '[]');

    // Remote config + achievements stubs
    window.getIsRemoteConfigSupported = () => bool(false);
    window.remoteConfigGet = () => msg('OnRemoteConfigGetFailed', '');
    window.getIsAchievementsSupported = () => bool(false);
    window.getIsGetAchievementsListSupported = () => bool(false);
    window.getIsAchievementsNativePopupSupported = () => bool(false);
    window.achievementsUnlock = () => msg('OnAchievementsUnlockCompleted', bool(false));
    window.achievementsShowNativePopup = () => msg('OnAchievementsShowNativePopupCompleted', bool(false));
    window.achievementsGetList = () => msg('OnAchievementsGetListCompletedSuccess', '[]');

    // ── Audio setup ───────────────────────────────────────────────────────────
    function ensureHowler() {
      return new Promise(resolve => {
        const t = Date.now();
        (function wait() {
          if (typeof window.Howl === 'function') return resolve(true);
          if (Date.now() - t > 3000) return resolve(false);
          setTimeout(wait, 25);
        })();
      });
    }
    function resumeAudio() {
      try { if (window.Howler?.ctx?.state !== 'running') Howler.ctx.resume(); } catch(e) {}
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') resumeAudio();
    });
    (async function() {
      if (await ensureHowler()) {
        try {
          new Howl({ src: ['https://cdn.jsdelivr.net/gh/StaticQuasar931/Brawl-Stars@main/silent.mp3'], loop: true, volume: 0 }).play();
        } catch(e) {}
        setTimeout(resumeAudio, 150);
      }
    })();

    // ── Boot Unity ────────────────────────────────────────────────────────────
    (async function bootUnity() {
      if (loadingStatus) loadingStatus.textContent = 'Loading game engine...';

      try {
        await new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = 'https://cdn.jsdelivr.net/gh/ragdoi-archers/zort@main/Build/web.loader.js';
          s.onload = resolve;
          s.onerror = () => reject(new Error('web.loader.js failed to load'));
          document.body.appendChild(s);
        });
      } catch(e) {
        console.error(e.message);
        if (loadingStatus) loadingStatus.textContent = 'Failed to load game. Please refresh.';
        return;
      }

      if (typeof createUnityInstance !== 'function') {
        console.error('createUnityInstance not found.');
        if (loadingStatus) loadingStatus.textContent = 'Failed to load game. Please refresh.';
        return;
      }

      try {
        const instance = await createUnityInstance(canvas, {
          dataUrl:            'https://cdn.jsdelivr.net/gh/ragdoi-archers/zort@main/Build/web.data.unityweb',
          frameworkUrl:       'https://cdn.jsdelivr.net/gh/ragdoi-archers/zort@main/Build/web.framework.js.unityweb',
          codeUrl:            'https://cdn.jsdelivr.net/gh/ragdoi-archers/zort@main/Build/web.wasm.unityweb',
          streamingAssetsUrl: 'https://cdn.jsdelivr.net/gh/ragdoi-archers/zort@main/StreamingAssets',
          companyName:    'StaticQuasar931',
          productName:    'Brawl Stars',
          productVersion: '1.0'
        }, onProgress);

        window.unityInstance = instance;
        if (loadingOverlay) loadingOverlay.remove();
        try { canvas.focus(); } catch(e) {}
      } catch(err) {
        console.error('Unity failed to load:', err);
        if (loadingStatus) loadingStatus.textContent = 'Game failed to load. Please refresh.';
      }
    })();
  </script>
